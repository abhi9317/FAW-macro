<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The scale of farmed-animal suffering</title>
<meta name="description" content="How much farmed-animal suffering is there, and how much do welfare reforms reduce? Change the assumptions and watch the answer move.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* The five brand colours, defined once and never redefined. Every other
     colour on the page - including both themes' roles - is a color-mix() of
     these, so the palette constraint holds literally: five hex codes, no more. */
  --c-ink:#09201f; --c-paper:#f7f9f7; --c-panel:#d3d9d4;
  --c-accent:#307d5b; --c-warm:#9a5b2b;

  /* Light theme roles. */
  --ink:var(--c-ink); --paper:var(--c-paper); --panel:var(--c-panel);
  --accent:var(--c-accent); --warm:var(--c-warm);

  /* Data colours: one per species, a separate palette from the five brand
     colours because nine series cannot be told apart from five hues. Order and
     steps validated (dataviz validate_palette.js) against both panel surfaces. */
  --sp-fish:#2a78d6; --sp-broilers:#eb6834; --sp-layers:#1baf7a;
  --sp-shrimp:#eda100; --sp-pigs:#e87ba4; --sp-ducks:#008300;
  --sp-other:color-mix(in srgb, var(--c-ink) 40%, var(--c-paper));
  /* Pain tiers: one-hue ordinal ramp (OKLCH hue 55), Excruciating darkest. */
  --tier-e:#6a2500; --tier-d:#894100; --tier-h:#a95f23; --tier-a:#ca7d44;

  --rule:color-mix(in srgb, var(--ink) 14%, transparent);
  --muted:color-mix(in srgb, var(--ink) 75%, transparent);
  --measure:min(100% - 2.5rem, 46rem);
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --disp:'Space Grotesk',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  color-scheme:light;
}
/* Dark theme roles. The accents are mixed toward --c-panel because the base
   brand greens score 3.40 and 3.15 against the dark ground - below the 4.5 WCAG
   AA needs for text. At 70% they reach 5.15 and 4.87. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:var(--c-panel); --paper:var(--c-ink);
    --panel:color-mix(in srgb, var(--c-panel) 10%, var(--c-ink));
    --accent:color-mix(in srgb, var(--c-accent) 70%, var(--c-panel));
    --warm:color-mix(in srgb, var(--c-warm) 70%, var(--c-panel));
    --sp-fish:#3987e5; --sp-broilers:#d95926; --sp-layers:#199e70;
    --sp-shrimp:#c98500; --sp-pigs:#d55181; --sp-ducks:#008300;
    --sp-other:color-mix(in srgb, var(--c-panel) 45%, var(--c-ink));
    --tier-e:#f9b379; --tier-d:#d7935a; --tier-h:#b6753b; --tier-a:#965719;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:var(--c-panel); --paper:var(--c-ink);
  --panel:color-mix(in srgb, var(--c-panel) 10%, var(--c-ink));
  --accent:color-mix(in srgb, var(--c-accent) 70%, var(--c-panel));
  --warm:color-mix(in srgb, var(--c-warm) 70%, var(--c-panel));
  --sp-fish:#3987e5; --sp-broilers:#d95926; --sp-layers:#199e70;
  --sp-shrimp:#c98500; --sp-pigs:#d55181; --sp-ducks:#008300;
  --sp-other:color-mix(in srgb, var(--c-panel) 45%, var(--c-ink));
  --tier-e:#f9b379; --tier-d:#d7935a; --tier-h:#b6753b; --tier-a:#965719;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
     font-family:var(--body);font-size:16.5px;line-height:1.6}
main{width:var(--measure);margin-inline:auto;padding-block:0 5rem}
h1{font-family:var(--disp);font-size:clamp(1.9rem,5vw,3rem);
   line-height:1.08;letter-spacing:-.02em;font-weight:600;margin:0 0 .6em}
h2{font-family:var(--disp);font-size:1.4rem;line-height:1.25;
   letter-spacing:-.01em;font-weight:600;margin:0 0 .7em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border-radius:.6rem;padding:1.1rem 1.25rem}
.bar{height:1rem;background:var(--paper);
     border-radius:.2rem;overflow:hidden}
.bar>i{display:block;height:100%;transition:width .3s}
.tag{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;
     text-transform:uppercase;padding:.1rem .4rem;border-radius:.2rem}
.tag-measured{background:var(--accent);color:var(--paper)}
.tag-proxied{background:color-mix(in srgb,var(--warm) 45%,transparent);color:var(--ink)}
.tag-author{background:var(--warm);color:var(--paper)}
.scroll-x{overflow-x:auto}
/* 100% stacked bar: 2px surface gap between segments, square at the
   baseline, 4px rounded at the far end. */
.stack{display:flex;gap:2px;height:24px}
.stack>div{min-width:2px;flex-basis:0;cursor:pointer;transition:opacity .15s,flex-grow .3s}
.stack>div:last-child{border-radius:0 4px 4px 0}
.stack>div:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* 90% interval: an ink line with end caps, drawn over its bar. */
.whisker,.whisker-key{position:absolute;top:50%;height:2px;margin-top:-1px;
  background:var(--ink)}
.whisker::before,.whisker::after,.whisker-key::before,.whisker-key::after{
  content:"";position:absolute;top:-4px;width:2px;height:10px;background:var(--ink)}
.whisker::before,.whisker-key::before{left:0}
.whisker::after,.whisker-key::after{right:0}
.whisker-key{position:relative;display:inline-block;width:1.4rem;top:0;margin:0}
/* Species rows: one line on wide screens; on phones the bar drops to its own
   line so the provenance tag doesn't squeeze it to nothing. */
.sp-row{display:grid;grid-template-columns:minmax(6rem,9rem) 1fr auto auto;
  grid-template-areas:"name bar pct tag";gap:.3rem .6rem;align-items:center;padding:.3rem 0}
.sp-name{grid-area:name;font-size:.9rem}.sp-bar{grid-area:bar}
.sp-pct{grid-area:pct;font-size:.78rem;text-align:right}.sp-tag{grid-area:tag}
@media (max-width:520px){
  .sp-row{grid-template-columns:1fr auto auto;
    grid-template-areas:"name pct tag" "bar bar bar";padding:.4rem 0}
}
/* Welfare-range dot plot. */
.wr-track{position:relative;height:1.4rem}
.wr-grid{position:absolute;top:0;bottom:0;width:1px;background:var(--rule)}
.wr-grid.human{background:color-mix(in srgb,var(--ink) 45%,transparent)}
.wr-line{position:absolute;top:50%;height:2px;margin-top:-1px;background:var(--accent);
  border-radius:1px}
.wr-dot,.wr-set{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;
  border-radius:50%;display:inline-block;box-sizing:border-box}
.wr-dot{background:var(--accent);box-shadow:0 0 0 2px var(--panel)}
.wr-set{border:2px solid var(--warm);background:var(--panel)}
.bracket{position:absolute;top:.2rem;height:.35rem;border:2px solid var(--ink);
  border-top:0}
.bracket-tick{position:absolute;top:0;width:2px;height:.7rem;margin-left:-1px;
  background:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<a href="#root" style="position:absolute;left:-9999px"
   onfocus="this.style.left='0.5rem'">Skip to content</a>
<button id="theme" aria-label="Switch between light and dark"
  style="position:fixed;top:.75rem;right:.75rem;z-index:9;cursor:pointer;
         font-family:var(--mono);font-size:.7rem;padding:.3rem .55rem;
         border-radius:.3rem;border:1px solid var(--rule);
         background:var(--paper);color:var(--ink)">theme</button>
<script>
document.getElementById("theme").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
});
</script>
<main id="root"></main>
<noscript>
  <main>
    <h1>The scale of farmed-animal suffering</h1>
    <p>This page needs JavaScript to let you change its assumptions. At its
    default settings it estimates <strong>690 million welfare-adjusted pain
    years</strong> per year across nine farmed species — one welfare-adjusted
    pain year being one year of disabling-level pain at human-equivalent
    intensity.</p>
    <p>Sources:
      <a href="https://welfarefootprint.org/">Welfare Footprint Project</a>,
      <a href="https://docs.google.com/document/d/1xUvMKRkEOJQcc6V7VJqcLLGAJ2SsdZno0jTIUb61D8k/edit?usp=sharing">Rethink Priorities welfare ranges</a>,
      <a href="https://rethinkpriorities.github.io/quantifying_shrimp_pain/">Quantifying shrimp pain</a>.
    </p>
  </main>
</noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"
  integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"
  crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"
  integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"
  crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script type="module" src="./ui.js"></script>
</body>
</html>
